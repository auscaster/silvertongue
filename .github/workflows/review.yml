name: review

# Pull requests to this repository are reviewed by the released Action, installed as anyone installs it.
# pull_request_target runs this workflow from the base branch, so a pull request from a fork gets a review
# without its code ever running.
on:
  pull_request_target:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number
        required: true
      voice:
        description: Voice
        default: marcus-aurelius
      humour:
        description: Humour
        type: choice
        options: [light, full, off]
        default: light

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: auscaster/silvertongue@v1
        with:
          voice: ${{ inputs.voice || 'marcus-aurelius' }}
          humour: ${{ inputs.humour || 'light' }}
          pull-request: ${{ inputs.pull-request }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
