name: mcp-release

# A tag mcp-v<version> publishes the stdio bridge to npm with provenance, then the MCP Registry
# entry com.auscaster/silvertongue, proven by the domain key whose public half auscaster.com serves
# at /.well-known/mcp-registry-auth.

on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: The tag names the package version
        run: test "mcp-v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run verify
      # A new package name has no settings page for a trusted publisher, so the first version
      # publishes with the NPM_TOKEN secret; the trusted publisher replaces it at the next release
      # and the secret is deleted. npm 11 exchanges the workflow's OIDC token when none is set.
      - name: Publish to npm unless this version exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(jq -r .version package.json)"
          if npm view "silvertongue@$version" version >/dev/null 2>&1; then
            echo "silvertongue@$version is already published."
          else
            npm publish --access public --provenance
          fi
      - name: Wait for npm to serve it
        run: |
          version="$(jq -r .version package.json)"
          for attempt in $(seq 1 12); do
            test "$(npm view "silvertongue@$version" version 2>/dev/null)" = "$version" && exit 0
            sleep $((attempt * 5))
          done
          echo "silvertongue@$version did not become readable." >&2
          exit 1
      - name: Publish the MCP Registry entry
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          curl --fail --location --silent --show-error --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate server.json
          ./mcp-publisher login http --domain auscaster.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish server.json
